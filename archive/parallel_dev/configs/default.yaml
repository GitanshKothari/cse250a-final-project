seed: 0

paths:
  raw: data/raw
  processed: data/processed
  models: models
  results: results

data:
  repo_id: nebius/SWE-agent-trajectories
  shards: null
  max_runs: null
  min_steps: 2

split:
  test: 0.15
  val: 0.15
  hmm_frac_of_train: 0.5

hmm:
  n_states_grid: [14]
  n_iter: 100
  tol: 1.0e-4
  n_init: 5
  pseudocount: 0.01
  max_train_runs: 8000
  max_len: 150
  select_by: val_loglik
  n_states: 14
  refit_full: true

early:
  prefixes: [3, 5, 10, 15, 20, 30]
  C: 1.0
  normalize_within_model: true
  n_boot: 1000

class_conditional:
  n_states: 14
  fit_on: hmm_train
  max_train_runs_per_class: null
